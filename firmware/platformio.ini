; Catnip firmware - PlatformIO project for the MeowKit (ESP32-S3).
;
; The env below mirrors the stock MeowKit firmware build. It is scaffolding for
; the on-device build; the runtime itself is verified on the host via `make test`
; (see Makefile) because the CI machine has no ESP toolchain.
;
; Note: the vendored Lua under lib/lua is compiled without any LUA_USE_* define,
; so Lua's dynamic-library loader compiles to a safe stub on the device.

[env:meowkit]
platform = espressif32@6.0.1
board = esp32s3box
framework = arduino
monitor_speed = 115200
; Not the 921600 PlatformIO would pick: the image grew past a megabyte when the
; boot animation's frames were embedded, and at that size the write over this
; board's USB-Serial/JTAG dies partway through with the port still open. Slower
; and it finishes in three and a half seconds.
upload_speed = 460800
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
extra_scripts = pre:tools/gen_assets.py

; Pinned, not ^: the caret resolved to 1.2.28, whose ST7789 init list and
; ESP32 SPI bus differ from the 1.1.16 the stock firmware was built with (its
; init table matches 1.1.16 byte for byte). Same library, same version, same
; panel - one less variable while the display is being brought up.
;
; LVGL is pinned exactly for the same reason, and one of its own besides: its
; configuration and its headers are one unit. src/lv_conf.h overrides three
; settings and lets lv_conf_internal.h default the rest, so a version bump that
; moves a default moves it underneath a config file that never mentioned it -
; and LVGL's failures of that kind are silent recolourings and quiet layout
; drift rather than a compile error. The caret would make that happen on
; whichever day upstream released.
;
; Version 9, not 8, and the choice constrains the ui.* renderer (#30) that
; builds real widgets on top of this. Two reasons, in order:
;
;   - Colour. v8 decides byte order with an LV_COLOR_16_SWAP flag in lv_conf.h;
;     v9 always renders native-order RGB565 and makes swapping an explicit call
;     in the flush callback. catnip_display_blit() reads native order, so on v9
;     the agreement is the default and there is no flag to get backwards. That
;     is the exact bug the diagnostic page's colour key was added to catch, and
;     it is worth removing the switch that causes it rather than setting it
;     correctly once.
;   - v8 is in maintenance and v9 is where the widget set is going, so #30 and
;     the shell (#33) would have to be rewritten against v9 sooner or later.
;
; 9.2.2 rather than the newest 9.x: it is the release this bring-up was
; compiled and read against - the flush contract in FULL render mode, the
; PSRAM pool hook, and the draw descriptors the diagnostic page's overlay uses
; were all checked in this version's source, not inferred from the manual.
lib_deps =
	lovyan03/LovyanGFX@1.1.16
	lvgl/lvgl@9.2.2

; The filter keeps out the two standalone sketches and nothing else. It
; deliberately does NOT keep out src/device/shell_ui.cpp, whose body is
; switched off behind CATNIP_DEVICE_WIP and which opens with `#include
; <lvgl.h>`. (src/device/lvgl_backend.cpp opened the same way and had the same
; guard until #30; its guard is gone and it is compiled like any other file.)
;
; That include is not invisible. PlatformIO's library dependency finder reads
; include directives as text and never runs the preprocessor, so it counts
; that file as depending on LVGL whether or not its #ifdef is taken - and
; before LVGL was declared above, that is a dependency it would go and satisfy
; on its own, with a copy of the library that has no lv_conf.h anywhere near
; it. The build then fails inside a library nobody asked for, over a file whose
; contents are switched off, which is a long way from where anyone would look.
;
; Excluding the file here would have silenced that, and it is the pattern the
; two sketches above use. It is the wrong answer now. LVGL is a real dependency
; of this firmware as of #29 - the diagnostic page is built out of it - so the
; finder's conclusion about that file is simply correct, and the fix is to make
; it right rather than to hide the question. Declaring the library and giving it
; src/lv_conf.h does that, and it buys something else: shell_ui.cpp compiles the
; moment its #ifdef is lifted, which was checked by lifting it.
;
; The claim that lvgl_backend.cpp did too turned out to be false, and #30 found
; out by rewriting it: it had been written against LVGL 8 names and a vtable
; that no longer existed, and lifting the guard would not have built. What was
; checked was that the *dependency* resolved, not that the file compiled. Its
; replacement carries no guard at all, so there is nothing left to check by
; hand - `pio run` compiles every LVGL call in it on every run.
build_src_filter = +<*> -<poc_display_min.cpp> -<probe_input.cpp>

build_flags =
	-std=gnu++17
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DCORE_DEBUG_LEVEL=3
	; Route Serial over the chip's hardware USB-Serial/JTAG rather than UART0.
	; Besides making the boot log visible on the USB cable, it leaves the ROM's
	; reset-to-download-mode reachable, so future flashes do not need the BOOT
	; button dance that getting here required.
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	; LVGL looks for its configuration as a plain "lv_conf.h" on the include
	; path, which -Isrc below already covers. The alternative, LV_CONF_PATH,
	; wants an absolute path and would only be right on one machine.
	-DLV_CONF_INCLUDE_SIMPLE
	-Ilib/lua
	-Isrc

; A minimal reproduction for the display, kept as evidence: it does exactly
; what the vendor's published BSP does and leaves the panel dark, because the
; published source is for an older board. See the comment at the top of
; src/poc_display_min.cpp and the pin map in src/device/board.h.
[env:poc]
platform = espressif32@6.0.1
board = esp32s3box
framework = arduino
board_build.partitions = default_16MB.csv
build_src_filter = -<*> +<poc_display_min.cpp>
lib_deps = lovyan03/LovyanGFX@1.1.16
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1

; The input probe (#42): reads every candidate pin under both pulls, the
; expander's input port, every ADC and the PMIC's interrupt registers, and
; logs changes over USB serial while a human presses things. Its output is the
; measured pin map that goes into src/device/board.h. It links the real power,
; I2C, PMIC and expander bring-up rather than copies, so what it measures is
; the board in the state the firmware puts it in - and, since the second pass,
; the real input_debounce too, so the switches board.h can already name are
; reported through the very filter the firmware will use rather than a second
; one written for the probe. See the comment at the top of src/probe_input.cpp.
[env:probe]
platform = espressif32@6.0.1
board = esp32s3box
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = default_16MB.csv
build_src_filter =
	-<*>
	+<probe_input.cpp>
	+<device/i2cbus.cpp>
	+<device/input_debounce.c>
	+<device/ioexp.cpp>
	+<device/pmu.cpp>
	+<device/power.cpp>
	; pmu.cpp asks battery_gauge.c what a cell voltage means. Listed even though
	; the probe never reads the battery: without it the image links only because
	; the unused function is garbage-collected, and the first person to call
	; catnip_pmu_poll() from here would meet an undefined symbol instead.
	+<device/battery_gauge.c>
build_flags =
	-std=gnu++17
	; Same memory configuration as the real firmware, so the probe runs on the
	; same octal-PSRAM module with PSRAM mapped - which is exactly when touching
	; GPIO 26-37 would crash. The allow-list in the sketch is what keeps it away
	; from them; building without PSRAM would only hide a mistake there.
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
